<!DOCTYPE html>
<html><head><meta charset="utf-8"><base target="_blank">
<style>
  html,body{margin:0;padding:0;background:#fff;color:#242424}
  body{font-family:Aptos,'Segoe UI',Calibri,Helvetica,Arial,sans-serif;font-size:14.5px;line-height:1.5;
       padding:4px 2px 16px;word-wrap:break-word;overflow-wrap:anywhere}
  img{max-width:100%;height:auto}
  img[src=""]{display:inline-block;min-width:24px;min-height:24px;background:#f3f2f1;outline:1px dashed #c8c6c4}
  table{max-width:100%}
  blockquote{margin:0 0 0 .8em;padding-left:.8em;border-left:2px solid #c8c6c4;color:#605e5c}
  pre{white-space:pre-wrap}
  a{color:#0F6CBD}
</style></head>
<body data-blocked="{{ blocked }}">{{ html|safe }}</body></html>
