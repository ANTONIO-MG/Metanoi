{% comment %}
The messenger's look, shared by the Messages page and embedded threads (a
``<style>`` block; include it once per page beside _chat_thread.html).

Theme tokens: every surface, line and bubble colour is a ``--chat-*`` custom
property, defined on ``:root`` for light and redefined under
``[data-bs-theme="dark"]``. The messenger once painted itself in literal #fff /
#f7f8fa / #eef0f3, so in dark mode the panel stayed white with the app's light
body text on it — unreadable. Keep it tokenised: there is exactly one place to
retune either palette. The dark values are taken from the app's own dark theme
(body #191a1f, borders rgba(255,255,255,.07)) rather than invented, so the
messenger sits on the page instead of floating above it. The bubble pair keeps
its intent in both themes — "mine" (``--chat-bubble-me``) is the heavier grey,
everyone else's the lighter surface — rather than turning blue in the dark,
which would make the two themes different designs.

Sections, in order:
  * layout — ``.msgr`` list + thread panes (stacked under 820px);
  * avatars ``.ava`` — the person's photo, initials only as a fallback; unread
    conversations get a blue ring, new messages a green ``.new-dot`` by the name;
  * thread header ``.thread-who`` — you · chat icon · who you are talking to;
  * messages — sticky day-divider pill ``.day-sep``; ``.run-start`` (first of a
    run) carries the name/time line and the extra gap; mine dark grey, others
    white; tail-shaping so a run of bubbles reads as one block; ``.quote`` above
    a reply; hover-revealed ``.msg-acts`` (reply / edit); read ``.ticks``;
    ``.msg.flash`` for a message jumped to from a quote;
  * composer ``.mz-chat`` — reuses the .mediazone drop behaviour but flat (no
    dashed box), with the ``#replyBar`` "Replying to…" strip;
  * call buttons, typing indicator and the ``#incomingCall`` toast.
{% endcomment %}
<style>
  :root{
    --chat-surface:#fff;
    --chat-surface-2:#f7f8fa;
    --chat-line:#eef0f3;
    --chat-line-soft:#f3f4f6;
    --chat-border:var(--bs-border-color,#e6e8ee);
    --chat-hover:#f8f9fb;
    --chat-active:#eaf2ff;
    --chat-ink:#212529;
    --chat-ink-dim:#9aa0a6;
    --chat-bubble:#fff;
    --chat-bubble-ink:#212529;
    --chat-bubble-me:#3f4550;
    --chat-bubble-me-ink:#fff;
    --chat-act-hover:#e9ecef;
    --chat-reply:#f1f5ff;
  }
  [data-bs-theme="dark"]{
    --chat-surface:#1c1e28;
    --chat-surface-2:#15171f;
    --chat-line:rgba(255,255,255,.08);
    --chat-line-soft:rgba(255,255,255,.06);
    --chat-border:rgba(255,255,255,.10);
    --chat-hover:rgba(255,255,255,.05);
    --chat-active:rgba(11,95,198,.22);
    --chat-ink:#e9ecef;
    --chat-ink-dim:#8b93a1;
    --chat-bubble:#262a36;
    --chat-bubble-ink:#e9ecef;
    --chat-bubble-me:#3d4453;
    --chat-bubble-me-ink:#fff;
    --chat-act-hover:rgba(255,255,255,.10);
    --chat-reply:rgba(11,95,198,.16);
  }

  .msgr{ display:flex; gap:0; height:calc(100vh - 190px); min-height:460px; }
  .msgr-list{ width:320px; flex:0 0 320px; border:1px solid var(--chat-border); border-radius:12px 0 0 12px; display:flex; flex-direction:column; background:var(--chat-surface); color:var(--chat-ink); }
  .msgr-thread{ flex:1; border:1px solid var(--chat-border); border-left:0; border-radius:0 12px 12px 0; display:flex; flex-direction:column; min-width:0; background:var(--chat-surface); color:var(--chat-ink); }
  .msgr-list .head, .msgr-thread .head{ padding:14px 16px; border-bottom:1px solid var(--chat-line); }
  .msgr-convos{ overflow-y:auto; flex:1; }
  .convo{ display:flex; gap:10px; align-items:center; padding:11px 14px; border-bottom:1px solid var(--chat-line-soft); text-decoration:none; color:inherit; }
  .convo:hover{ background:var(--chat-hover); } .convo.active{ background:var(--chat-active); }

  .ava{ position:relative; flex:0 0 auto; border-radius:50%; overflow:hidden; display:inline-flex;
        align-items:center; justify-content:center; font-weight:700; color:#fff; background:#6c8cff;
        text-transform:uppercase; letter-spacing:.02em; }
  .ava img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ava-42{ width:42px;height:42px;font-size:.9rem; }
  .ava-36{ width:36px;height:36px;font-size:.78rem; }
  .ava-28{ width:28px;height:28px;font-size:.66rem; }
  .ava-group{ background:#8a94a6; }
  .convo .ava{ transition:box-shadow .2s ease; }
  .convo.has-unread .ava{ box-shadow:0 0 0 3px #0B5FC6, 0 0 0 5px rgba(11,95,198,.2); }
  .convo.has-unread .conv-name{ font-weight:700; }
  .new-dot{ display:inline-flex;align-items:center;gap:4px;background:#19c37d;color:#fff;font-size:.62rem;font-weight:700;
    padding:1px 7px;border-radius:999px;line-height:1.4; box-shadow:0 0 0 3px rgba(25,195,125,.15); }
  .new-dot .g-pulse{ width:6px;height:6px;border-radius:50%;background:#fff;animation:gpulse 1s ease infinite; }
  @keyframes gpulse{ 0%,100%{opacity:.5} 50%{opacity:1} }
  .min-w-0{ min-width:0; }

  .thread-who{ display:flex; align-items:center; gap:8px; min-width:0; }
  .thread-who .name{ font-weight:600; line-height:1.15; }
  .thread-who .sub{ font-size:.72rem; color:var(--chat-ink-dim); }
  .thread-link{ color:#0B5FC6; font-size:1.05rem; flex:0 0 auto; }
  .peer-stack{ display:flex; }
  .peer-stack .ava + .ava{ margin-left:-10px; box-shadow:0 0 0 2px var(--chat-surface); }

  .msgr-msgs{ flex:1; overflow-y:auto; padding:16px; background:var(--chat-surface-2); position:relative; }
  .day-sep{ position:sticky; top:0; z-index:3; text-align:center; margin:6px 0 14px; pointer-events:none; }
  .day-sep span{ display:inline-block; background:rgba(33,37,41,.72); color:#fff; font-size:.68rem; font-weight:600;
    letter-spacing:.02em; padding:3px 12px; border-radius:999px; backdrop-filter:blur(4px); box-shadow:0 2px 6px rgba(0,0,0,.12); }

  .msg{ display:flex; gap:8px; align-items:flex-end; margin-bottom:3px; }
  .msg.me{ flex-direction:row-reverse; }
  .msg.run-start{ margin-top:14px; }
  .msg .ava-slot{ width:28px; flex:0 0 28px; }
  .msg .col{ min-width:0; max-width:78%; display:flex; flex-direction:column; }
  .msg.me .col{ align-items:flex-end; }
  .msg .meta{ font-size:.72rem; color:var(--chat-ink-dim); margin-bottom:3px; padding:0 4px; }
  .msg .bubble{ padding:8px 12px; border-radius:14px; background:var(--chat-bubble); color:var(--chat-bubble-ink);
    box-shadow:0 1px 2px rgba(0,0,0,.06); white-space:pre-wrap; word-break:break-word; }
  .msg.me .bubble{ background:var(--chat-bubble-me); color:var(--chat-bubble-me-ink); }
  .msg.me .bubble a{ color:#cfe2ff; }
  .msg .bubble .media-grid{ max-width:280px; }
  .msg:not(.run-start) .bubble{ border-top-left-radius:6px; }
  .msg.me:not(.run-start) .bubble{ border-top-left-radius:14px; border-top-right-radius:6px; }

  .quote{ border-left:3px solid #0B5FC6; background:rgba(11,95,198,.07); border-radius:6px;
    padding:4px 8px; margin-bottom:5px; font-size:.78rem; line-height:1.3; cursor:pointer; }
  .msg.me .quote{ background:rgba(255,255,255,.14); border-left-color:#9ec5fe; }
  .quote .q-who{ font-weight:700; display:block; }
  .quote .q-body{ opacity:.8; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .msg-acts{ display:flex; gap:2px; align-self:center; opacity:0; transition:opacity .15s ease; flex:0 0 auto; }
  .msg:hover .msg-acts, .msg:focus-within .msg-acts{ opacity:1; }
  .msg-acts button{ border:0; background:transparent; color:#8a94a6; padding:2px 5px; border-radius:6px; font-size:.86rem; line-height:1; }
  .msg-acts button:hover{ background:var(--chat-act-hover); color:#0B5FC6; }

  .ticks{ font-size:.7rem; margin-left:5px; }
  .ticks.read{ color:#4dabf7; }
  .msg .stamp{ font-size:.66rem; color:var(--chat-ink-dim); margin-top:2px; padding:0 4px; }
  .msg.me .stamp{ text-align:right; }
  @keyframes flashmsg{ 0%,100%{ background:transparent } 30%{ background:rgba(11,95,198,.14) } }
  .msg.flash{ animation:flashmsg 1.4s ease; border-radius:10px; }

  .msgr-compose.mz-chat{ display:block;padding:10px 12px;border-radius:0;border:0;border-top:1px solid var(--chat-line);background:var(--chat-surface);cursor:default; }
  .msgr-compose.mz-chat.dragging{ background:#E8F0FB;box-shadow:inset 0 0 0 2px #0B5FC6; }
  .msgr-compose.mz-chat .mediazone-preview{ margin-bottom:8px; }
  .mz-chat-row{ display:flex;gap:8px;align-items:flex-end; }
  .mz-chat-actions{ display:flex;gap:4px; }
  .mz-chat-actions .mz-act{ width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem; }
  .msgr-compose textarea{ flex:1;resize:none; }
  #replyBar{ display:none; align-items:center; gap:8px; background:var(--chat-reply); border-left:3px solid #0B5FC6;
    border-radius:6px; padding:6px 10px; margin-bottom:8px; font-size:.8rem; }
  #replyBar.show{ display:flex; }
  #replyBar .r-body{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--chat-ink-dim); }

  .call-btn{ width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center; }
  .typing-bar{ display:none;align-items:center;gap:8px;padding:6px 16px;border-top:1px solid var(--chat-line);color:var(--chat-ink-dim);font-size:.82rem; }
  .typing-bar.show{ display:flex; }
  .typing-dots{ display:inline-flex;gap:3px; }
  .typing-dots span{ width:6px;height:6px;border-radius:50%;background:#0B5FC6;opacity:.4;animation:typing 1.2s infinite; }
  .typing-dots span:nth-child(2){ animation-delay:.2s } .typing-dots span:nth-child(3){ animation-delay:.4s }
  @keyframes typing{ 0%,60%,100%{ transform:translateY(0);opacity:.4 } 30%{ transform:translateY(-4px);opacity:1 } }
  #incomingCall{ position:fixed; top:80px; right:20px; z-index:1080; width:300px; display:none; }
  #incomingCall.show{ display:block; }
  .ring-ava{ width:46px;height:46px;border-radius:50%;background:#0B5FC6;color:#fff;display:flex;align-items:center;justify-content:center;
    animation:ringpulse 1s ease infinite; }
  @keyframes ringpulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(11,95,198,.4) } 50%{ box-shadow:0 0 0 10px rgba(11,95,198,0) } }
  @media (max-width:820px){ .msgr{ flex-direction:column;height:auto } .msgr-list{ width:100%;flex:none;border-radius:12px } .msgr-thread{ border-left:1px solid var(--chat-border);border-radius:12px;margin-top:12px } .msg .col{ max-width:88%; } }
</style>
