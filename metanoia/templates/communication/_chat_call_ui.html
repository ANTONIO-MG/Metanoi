{% comment %}The incoming-call toast, shared by the Messages page and embedded threads.{% endcomment %}
<div id="incomingCall" class="card shadow-lg border-0" role="alert" aria-live="assertive">
  <div class="card-body d-flex align-items-center gap-3">
    <div class="ring-ava"><i class="bi bi-camera-video-fill" aria-hidden="true"></i></div>
    <div class="min-w-0 flex-grow-1">
      <strong class="d-block text-truncate" id="incomingTitle">Incoming video call</strong>
      <small class="text-muted">The call is live now</small>
    </div>
    <div class="d-flex flex-column gap-1">
      <a class="btn btn-success btn-sm py-0" id="incomingJoin" href="#" title="Join the video call" aria-label="Join the video call"><i class="bi bi-camera-video-fill" aria-hidden="true"></i></a>
      <button type="button" class="btn btn-danger btn-sm py-0" id="incomingDismiss" title="Dismiss" aria-label="Dismiss"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </div>
  </div>
</div>
