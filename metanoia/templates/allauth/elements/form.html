{% load allauth %}
<form class="allauth-form" method="{{ attrs.method }}" {% if attrs.action %}action="{{ attrs.action }}"{% endif %}{% if attrs.id %} id="{{ attrs.id }}"{% endif %}>
    {% slot body %}
    {% endslot %}
    {% if slots.actions %}<div class="allauth-actions">
    {% slot actions %}
    {% endslot %}
    </div>{% endif %}
</form>
